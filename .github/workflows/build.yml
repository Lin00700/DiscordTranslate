name: Build Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project DiscordTranslate.xcodeproj \
            -scheme DiscordTranslate -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/DiscordTranslate.app Payload/
          zip -r DiscordTranslate-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordTranslate-unsigned-ipa
          path: DiscordTranslate-unsigned.ipa
